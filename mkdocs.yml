site_name: Privacy audit
site_url: https://willingc.github.io/compliance-checker
theme:
  name: material
  features:
    - navigation.indexes

plugins:
  - glightbox:
      touchNavigation: false
      loop: false
      effect: zoom
      slide_effect: none
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
        - custom-skip-class-name
      auto_themed: false
      auto_caption: false
      caption_position: bottom
      background: white
      shadow: false
      manual: false

  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - index.md
  - 02-week1_use_cases.md
  - 03-week2_risk_model.md
  - 04-example_template.md
